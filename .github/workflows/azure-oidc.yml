name: azure-oidc

on:
  workflow_dispatch:
  push:
    branches: [main]

# id-token: write autorise GitHub à émettre le jeton OIDC.
permissions:
  id-token: write
  contents: read

jobs:
  whoami:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az group show --name "${{ vars.RESOURCE_GROUP }}" --query "{nom:name, region:location}" -o table
      - run: az group list -o table
